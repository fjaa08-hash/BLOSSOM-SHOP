<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>C4ny_Shop · Tienda</title><link rel="manifest" href="tienda.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="theme-color" content="#A63FBF"><link rel="icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Dancing+Script:wght@700&family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--pd:#7A1F95}*{box-sizing:border-box}body{margin:0;font-family:Sora,system-ui,sans-serif;background:#FFF7EE;color:#111;padding-bottom:96px}
header{display:flex;align-items:center;justify-content:center;gap:14px;padding:12px 16px;background:linear-gradient(140deg,#FFF6EA,#F7DDBB);box-shadow:0 2px 0 #FF8CF3,0 6px 20px rgba(214,70,255,.55)}
header img{width:92px;height:92px;object-fit:cover;border-radius:14px;border:2px solid #fff;box-shadow:0 0 0 1.5px #FF8CF3,0 0 12px #E04BFF;flex:none}.hb{text-align:left}header .neon{font-size:18px}
h1{font:400 28px 'Abril Fatface',serif;margin:0 0 4px;background:linear-gradient(120deg,#7A1F95,#A63FBF,#8E2FA8);-webkit-background-clip:text;background-clip:text;color:transparent}
.neon{display:inline-block;font:700 21px 'Dancing Script',cursive;color:#FFE3FB;background:#2B0A3D;border:1.5px solid #FF7BF0;border-radius:20px;padding:0 14px 2px;text-shadow:0 0 4px #FFB3F6,0 0 10px #F04BFF;box-shadow:0 0 6px #F04BFF,0 0 16px rgba(240,75,255,.65)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 16px 0;max-width:900px;margin:auto}.chip{flex:none;border:1.5px solid #C96BE0;background:#fff;color:#7A1F95;font-weight:700;font-size:13px;padding:8px 14px;border-radius:20px}.chip.on{background:#2B0A3D;color:#FFE3FB;border-color:#FF7BF0;box-shadow:0 0 10px rgba(240,75,255,.8)}select{width:100%;padding:8px;border:1.5px solid #EBC9A0;border-radius:10px;font:inherit;font-size:12.5px;background:#fff}.ql{display:flex;align-items:center;gap:6px}.ql button{width:28px;height:28px;border-radius:50%;border:1.5px solid #A63FBF;background:#fff;color:#7A1F95;font-weight:700}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:16px;max-width:900px;margin:auto}@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 10px rgba(122,31,149,.12);display:flex;flex-direction:column}
.card img{width:100%;aspect-ratio:1;object-fit:cover;background:#F6D3A4}.in{padding:10px;display:flex;flex-direction:column;gap:4px;flex:1}
.nm{font-weight:700;font-size:14px}.tg{display:flex;flex-wrap:wrap;gap:4px}.tg span{background:#F3E3FA;color:#7A1F95;border-radius:10px;padding:2px 8px;font-size:11.5px;font-weight:600}.sub{font-size:12px;color:#6B6B6B}.pr{font-weight:700;color:var(--pd);font-size:16px}
button{font-family:inherit;cursor:pointer}.add,.go{border:0;border-radius:12px;padding:10px;font-weight:700;color:#fff;background:linear-gradient(120deg,#7A1F95,#C21BFF);box-shadow:0 0 10px rgba(194,27,255,.5)}
.add{margin-top:auto}.add[disabled],.go[disabled]{background:#ccc;box-shadow:none}.go{width:100%;padding:14px;font-size:16px;border-radius:14px}
.qty{display:flex;align-items:center;justify-content:space-between;margin-top:auto}.qty button{width:34px;height:34px;border-radius:50%;border:1.5px solid #A63FBF;background:#fff;color:var(--pd);font-size:18px;font-weight:700}
#bar{transition:transform .15s;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));display:none;justify-content:space-between;padding:15px 18px;border:0;border-radius:18px;color:#fff;font-weight:700;font-size:15px;background:linear-gradient(120deg,#7A1F95,#C21BFF);box-shadow:0 0 0 2px #fff,0 0 16px #E04BFF;max-width:560px;margin:auto}
#zoom{position:fixed;inset:0;background:rgba(20,5,30,.88);display:none;align-items:center;justify-content:center;z-index:20;padding:10px}#zoom.show{display:flex}#zoom img{max-width:100%;max-height:92vh;border-radius:10px;object-fit:contain}#zoom .x{position:absolute;top:12px;right:14px;border:0;background:#fff;border-radius:50%;width:38px;height:38px;font-size:18px}#zoom .ld{position:absolute;bottom:18px;color:#fff;font-size:13px}.card img{cursor:zoom-in}#sheet{position:fixed;inset:0;background:rgba(40,10,55,.55);display:none;align-items:flex-end;z-index:9}#sheet.show{display:flex}
.box{background:#fff;width:100%;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px;max-width:560px;margin:auto}
input,textarea{width:100%;padding:12px;border:1.5px solid #EBC9A0;border-radius:12px;font:inherit;margin:4px 0 10px}label{font-size:12.5px;font-weight:700;color:#5E1B75}
.pm{display:flex;gap:8px;margin:6px 0 10px}.pm button{flex:1;padding:10px 4px;border-radius:14px;border:1.5px solid #C96BE0;background:#fff;color:#7A1F95;font-weight:700;font-size:13px}
.pm button.on{background:#2B0A3D;color:#FFE3FB;border-color:#FF7BF0;box-shadow:0 0 10px rgba(240,75,255,.8)}
.info{background:#FBE6CC;border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.5;margin-bottom:10px}.ln{display:flex;justify-content:space-between;font-size:14px;padding:4px 0}
.tot{font-size:20px;font-weight:700;color:var(--pd)}
</style></head><body>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import {getFirestore,collection,onSnapshot,doc,setDoc,getDoc} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
const db=getFirestore(initializeApp({apiKey:"AIzaSyAygrlyvvM5v7Q1lOXUTkcdhqNXJoJsgtk",authDomain:"c4nyshop-virtual-store.firebaseapp.com",projectId:"c4nyshop-virtual-store",storageBucket:"c4nyshop-virtual-store.firebasestorage.app",messagingSenderId:"192015539406",appId:"1:192015539406:web:b621c219bd8d40d572449f"}));
const $=id=>document.getElementById(id),cart={},eur=n=>'€'+Number(n).toFixed(2);let prods=[],pm='Provincial',proof='',cat='Todo',sel={};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const A=[['model','Modelo'],['size','Talla'],['color','Color'],['ml','Presentación']];
const val=(p,k)=>k=='ml'?(p.ml?p.ml+' ml':''):(p[k]||'');
const lab=p=>[p.name,p.model,p.size&&'Talla '+p.size,p.color,p.ml&&p.ml+' ml'].filter(Boolean).join(' · ');
let KM={};
const gk=p=>KM[p.id]||((p.category||'Otros')+'|'+(p.name||'').trim().toLowerCase());
function buildKeys(){KM={};const b={};prods.forEach(p=>{const base=(p.category||'Otros')+'|'+(p.name||'').trim().toLowerCase(),shape=A.map(([k])=>val(p,k)?1:0).join('');(b[base+'#'+shape]=b[base+'#'+shape]||[]).push(p)});
Object.entries(b).forEach(([k,g])=>{const cnt={};g.forEach(p=>{const t=A.map(([x])=>val(p,x)).join('|');cnt[t]=(cnt[t]||0)+1});g.forEach(p=>{const t=A.map(([x])=>val(p,x)).join('|');KM[p.id]=(!t.replace(/\|/g,'')||cnt[t]>1)?k+'#'+p.id:k})})}
const lines=()=>Object.entries(cart).map(([id,q])=>({p:prods.find(x=>x.id===id),q})).filter(l=>l.p);
const total=()=>lines().reduce((s,l)=>s+l.p.price*l.q,0);
const pick=g=>{const s=sel[gk(g[0])]||{},ok=g.filter(p=>p.stock>0);return ok.find(p=>A.every(([k])=>!s[k]||val(p,k)===s[k]))||ok[0]||g[0]};
const opts=(g,k)=>{const s=sel[gk(g[0])]||{};return [...new Set(g.filter(p=>p.stock>0&&A.every(([j])=>j==k||!s[j]||val(p,j)===s[j])).map(p=>val(p,k)).filter(Boolean))]};
onSnapshot(collection(db,'catalogo'),s=>{prods=s.docs.map(d=>({id:d.id,...d.data()})).filter(p=>Number(p.stock)>0);buildKeys();draw()},()=>{$('grid').innerHTML='<p style="grid-column:1/-1;text-align:center">No se pudo cargar el catálogo. Intenta de nuevo.</p>'});
function draw(){const cats=[...new Set(prods.slice().sort((a,b)=>(a.catIdx??99)-(b.catIdx??99)).map(p=>p.category||'Otros'))];if(cat!='Todo'&&!cats.includes(cat))cat='Todo';
$('chips').innerHTML=['Todo',...cats].map(c=>`<button class="chip ${c==cat?'on':''}" data-c="${esc(c)}" onclick="setCat(this.dataset.c)">${esc(c)}</button>`).join('');
const list=prods.filter(p=>cat=='Todo'||(p.category||'Otros')==cat).sort((x,y)=>(x.name||'').localeCompare(y.name||'')||String(x.model||'').localeCompare(String(y.model||''))||String(x.size||'').localeCompare(String(y.size||''),undefined,{numeric:true})||String(x.color||'').localeCompare(String(y.color||''))||(x.ml||0)-(y.ml||0));
$('cnt').textContent=list.length+(list.length==1?' producto disponible':' productos disponibles');
$('grid').innerHTML=list.map(c=>{const img=c.image||'',tags=[c.model,c.size&&'Talla '+c.size,c.color,c.ml&&c.ml+' ml'].filter(Boolean);
return `<div class="card"><img src="${esc(img)}" alt="" loading="lazy" onclick="openZoom('${c.id}')"><div class="in"><div class="nm">${esc(c.name)}</div>${tags.length?`<div class="tg">${tags.map(x=>`<span>${esc(x)}</span>`).join('')}</div>`:''}<div class="pr">${eur(c.price)}</div><div class="sub">Disponibles: ${c.stock}</div><button class="add" onclick="addV('${c.id}')">Agregar</button></div></div>`}).join('')||'<p style="grid-column:1/-1;text-align:center;color:#6B6B6B">No hay productos disponibles por ahora. ¡Vuelve pronto!</p>';bar()}
function bar(){const n=lines().reduce((s,l)=>s+l.q,0);$('bar').style.display=n?'flex':'none';$('bn').textContent='🛍 Ver pedido ('+n+')';$('bt').textContent=eur(total())}
const hdC={};let zid='';
window.openZoom=async id=>{const p=prods.find(x=>x.id===id);if(!p)return;zid=id;const i=$('zi'),l=$('zl');i.src=hdC[id]||p.image||'';l.textContent=hdC[id]?'':'Cargando calidad completa…';$('zoom').classList.add('show');
if(!hdC[id]){try{const d=await getDoc(doc(db,'catalogo_hd',id));if(d.exists()&&d.data().image)hdC[id]=d.data().image}catch(e){}
if(zid==id){if(hdC[id])i.src=hdC[id];l.textContent=''}}};
window.closeZoom=()=>$('zoom').classList.remove('show');
window.setCat=c=>{cat=c;draw()};
window.setSel=(k,a,v)=>{const g=prods.filter(p=>gk(p)==k);sel[k]={...sel[k],[a]:v};const c=pick(g);sel[k]=Object.fromEntries(A.map(([x])=>[x,val(c,x)]));draw()};
window.addV=id=>{const p=prods.find(x=>x.id===id),q=(cart[id]||0)+1;if(q>p.stock)return alert('No hay más unidades disponibles de esta opción');cart[id]=q;bar();const b=$('bar');b.style.transform='scale(1.04)';setTimeout(()=>b.style.transform='',160)};
const keep=f=>{const I=['fn','fp','ft','fr'],v=I.map(i=>$(i)?$(i).value:'');f();I.forEach((i,n)=>$(i)&&($(i).value=v[n]))};
window.cq=(id,d)=>{const p=prods.find(x=>x.id===id),q=(cart[id]||0)+d;if(q<=0)delete cart[id];else if(q<=p.stock)cart[id]=q;bar();if(!lines().length)return closeCart();keep(form)};
window.openCart=()=>{$('sheet').classList.add('show');form()};
window.closeCart=()=>$('sheet').classList.remove('show');
const PM={Provincial:'📱 <b>Pago Móvil · Provincial</b><br>C.I.: 15558489<br>Teléfono: 04126542694',Banesco:'📱 <b>Pago Móvil · Banesco</b><br>C.I.: 15558489<br>Teléfono: 04126542694',Binance:'💠 <b>Binance</b> (USDT)<br>ID: Candyzgoitia1@gmail.com'};
function form(){$('box').innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0;font-size:18px">Tu pedido</h2><button onclick="closeCart()" style="border:0;background:#eee;border-radius:50%;width:34px;height:34px;font-size:16px">✕</button></div>
${lines().map(l=>`<div class="ln"><span>${esc(lab(l.p))}<span class="ql"><button onclick="cq('${l.p.id}',-1)">−</button><b>${l.q}</b><button onclick="cq('${l.p.id}',1)">+</button></span></span><b>${eur(l.p.price*l.q)}</b></div>`).join('')}<div class="ln tot"><span>Total</span><span>${eur(total())}</span></div>
<label>Tu nombre</label><input id="fn" autocomplete="name"><label>Tu teléfono (WhatsApp)</label><input id="fp" type="tel" autocomplete="tel"><label>Notas (opcional)</label><textarea id="ft" rows="2"></textarea>
<label>Método de pago</label><div class="pm">${Object.keys(PM).map(k=>`<button class="${k==pm?'on':''}" onclick="setPm('${k}')">${k}</button>`).join('')}</div><div class="info">${PM[pm]}<br><small>Cobramos en $ o USDT (consulta disponibilidad). Paga y adjunta tu comprobante.</small></div>
<label>Referencia del pago</label><input id="fr"><label>Captura del comprobante</label><input id="ff" type="file" accept="image/*" onchange="pick(this)"><button class="go" id="gb" onclick="send()">Enviar pedido</button>`}
window.setPm=k=>{pm=k;keep(form)};
window.pick=inp=>{const f=inp.files[0];if(!f)return;const im=new Image();im.onload=()=>{const s=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);proof=c.toDataURL('image/jpeg',.7)};im.src=URL.createObjectURL(f)};
window.send=async()=>{const name=$('fn').value.trim(),phone=$('fp').value.trim(),ref=$('fr').value.trim(),items=lines().map(l=>({refId:l.p.id,name:lab(l.p),price:l.p.price,qty:l.q}));
