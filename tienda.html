<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Blossom Shop · Tienda</title><link rel="manifest" href="tienda.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="theme-color" content="#FFE600"><link rel="icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Dancing+Script:wght@700&family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--pd:#7A5C00;--neon:#FFE600;--neon2:#FFF36B;--ink:#16130A}*{box-sizing:border-box}body{margin:0;font-family:Sora,system-ui,sans-serif;background:#FFFDF0;color:#111;padding-bottom:96px}
header{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px 16px 20px;text-align:center;background:radial-gradient(120% 90% at 50% 0%,#2A2400 0%,#15120A 62%,#0D0B06 100%);border-bottom:2px solid var(--neon);box-shadow:0 0 8px var(--neon),0 8px 30px rgba(255,230,0,.45)}
header img{width:min(62vw,240px);height:min(62vw,240px);object-fit:cover;border-radius:50%;border:3px solid var(--neon2);box-shadow:0 0 0 2px #15120A,0 0 14px var(--neon),0 0 38px rgba(255,230,0,.75),0 0 80px rgba(255,230,0,.35);flex:none;background:#fff}.hb{text-align:center}header .neon{font-size:22px;display:inline-block;font:700 21px 'Dancing Script',cursive;color:#FFFBD0;background:#15120A;border:1.5px solid var(--neon);border-radius:20px;padding:0 16px 2px;text-shadow:0 0 4px #FFF59A,0 0 10px #FFE600;box-shadow:0 0 6px var(--neon),0 0 18px rgba(255,230,0,.65)}
h1{font:400 34px 'Abril Fatface',serif;margin:0 0 6px;background:linear-gradient(120deg,#FFF59A,#FFE600 45%,#FFC800);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 8px rgba(255,230,0,.6))}

.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 16px 0;max-width:900px;margin:auto}.chip{flex:none;border:1.5px solid #E0C400;background:#fff;color:#5C4600;font-weight:700;font-size:13px;padding:8px 14px;border-radius:20px}.chip.on{background:#15120A;color:var(--neon);border-color:var(--neon);box-shadow:0 0 10px rgba(255,230,0,.8);text-shadow:0 0 6px rgba(255,230,0,.8)}select{width:100%;padding:8px;border:1.5px solid #E8D98A;border-radius:10px;font:inherit;font-size:12.5px;background:#fff}.ql{display:flex;align-items:center;gap:6px}.ql button{width:28px;height:28px;border-radius:50%;border:1.5px solid #D4B800;background:#fff;color:#5C4600;font-weight:700}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:16px;max-width:900px;margin:auto}@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 10px rgba(122,92,0,.14);display:flex;flex-direction:column}
.card img{width:100%;aspect-ratio:1;object-fit:cover;background:#FBF1C4}.in{padding:10px;display:flex;flex-direction:column;gap:4px;flex:1}
.nm{font-weight:700;font-size:14px}.tg{display:flex;flex-wrap:wrap;gap:4px}.tg span{background:#FFF6BF;color:#6B5200;border-radius:10px;padding:2px 8px;font-size:11.5px;font-weight:600}.sub{font-size:12px;color:#6B6B6B}.pr{font-weight:700;color:var(--pd);font-size:16px}
button{font-family:inherit;cursor:pointer}.add,.go{border:0;border-radius:12px;padding:10px;font-weight:700;color:#15120A;background:linear-gradient(120deg,#FFF04D,#FFD400);box-shadow:0 0 12px rgba(255,230,0,.75)}
.add{margin-top:auto}.add[disabled],.go[disabled]{background:#ccc;color:#666;box-shadow:none}.go{width:100%;padding:14px;font-size:16px;border-radius:14px}
.qty{display:flex;align-items:center;justify-content:space-between;margin-top:auto}.qty button{width:34px;height:34px;border-radius:50%;border:1.5px solid #D4B800;background:#fff;color:var(--pd);font-size:18px;font-weight:700}
#bar{transition:transform .15s;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));display:none;justify-content:space-between;padding:15px 18px;border:0;border-radius:18px;color:var(--neon);font-weight:700;font-size:15px;background:#15120A;box-shadow:0 0 0 2px var(--neon),0 0 18px rgba(255,230,0,.85);text-shadow:0 0 6px rgba(255,230,0,.8);max-width:560px;margin:auto}
#zoom{position:fixed;inset:0;background:rgba(13,11,6,.9);display:none;align-items:center;justify-content:center;z-index:20;padding:10px}#zoom.show{display:flex}#zoom img{max-width:100%;max-height:92vh;border-radius:10px;object-fit:contain}#zoom .x{position:absolute;top:12px;right:14px;border:0;background:#fff;border-radius:50%;width:38px;height:38px;font-size:18px}#zoom .ld{position:absolute;bottom:18px;color:#fff;font-size:13px}.card img{cursor:zoom-in}#sheet{position:fixed;inset:0;background:rgba(13,11,6,.6);display:none;align-items:flex-end;z-index:9}#sheet.show{display:flex}
.box{background:#fff;width:100%;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px;max-width:560px;margin:auto}
input,textarea{width:100%;padding:12px;border:1.5px solid #E8D98A;border-radius:12px;font:inherit;margin:4px 0 10px}label{font-size:12.5px;font-weight:700;color:#4A3A00}
.pm{display:flex;gap:8px;margin:6px 0 10px}.pm button{flex:1;padding:10px 4px;border-radius:14px;border:1.5px solid #E0C400;background:#fff;color:#5C4600;font-weight:700;font-size:13px}
.pm button.on{background:#15120A;color:var(--neon);border-color:var(--neon);box-shadow:0 0 10px rgba(255,230,0,.8)}
.info{background:#FFF4B8;border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.5;margin-bottom:10px}.ln{display:flex;justify-content:space-between;font-size:14px;padding:4px 0}
.tot{font-size:20px;font-weight:700;color:var(--pd)}
</style></head><body>

import {initializeApp} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import {getFirestore,collection,onSnapshot,doc,setDoc,getDoc} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
const db=getFirestore(initializeApp({apiKey:"AIzaSyCAfxGIwP2mnHVs6Pf_-Afh4JaEmTmTMY8",authDomain:"blossom-shop-2d2bf.firebaseapp.com",projectId:"blossom-shop-2d2bf",storageBucket:"blossom-shop-2d2bf.firebasestorage.app",messagingSenderId:"568312491632",appId:"1:568312491632:web:0daafb81bac11ba9aa0eb5"}));
const $=id=>document.getElementById(id),cart={},eur=n=>'€'+Number(n).toFixed(2);let prods=[],pm='Pago Móvil',proof='',cat='Todo',sel={};

const gk=p=>KM[p.id]||((p.category||'Otros')+'|'+(p.name||'').trim().toLowerCase());
function buildKeys(){KM={};const b={};prods.forEach(p=>{const base=(p.category||'Otros')+'|'+(p.name||'').trim().toLowerCase(),shape=A.map(([k])=>val(p,k)?1:0).join('');(b[base+'#'+shape]=b[base+'#'+shape]||[]).push(p)});

const pick=g=>{const s=sel[gk(g[0])]||{},ok=g.filter(p=>p.stock>0);return ok.find(p=>A.every(([k])=>!s[k]||val(p,k)===s[k]))||ok[0]||g[0]};
const opts=(g,k)=>{const s=sel[gk(g[0])]||{};return [...new Set(g.filter(p=>p.stock>0&&A.every(([j])=>j==k||!s[j]||val(p,j)===s[j])).map(p=>val(p,k)).filter(Boolean))]};

function draw(){const cats=[...new Set(prods.slice().sort((a,b)=>(a.catIdx??99)-(b.catIdx??99)).map(p=>p.category||'Otros'))];if(cat!='Todo'&&!cats.includes(cat))cat='Todo';

function bar(){const n=lines().reduce((s,l)=>s+l.q,0);$('bar').style.display=n?'flex':'none';$('bn').textContent='🛍 Ver pedido ('+n+')';$('bt').textContent=eur(total())}
const hdC={};let zid='';
window.openZoom=async id=>{const p=prods.find(x=>x.id===id);if(!p)return;zid=id;const i=$('zi'),l=$('zl');i.src=hdC[id]||p.image||'';l.textContent=hdC[id]?'':'Cargando calidad completa…';$('zoom').classList.add('show');
if(!hdC[id]){try{const d=await getDoc(doc(db,'catalogo_hd',id));if(d.exists()&&d.data().image)hdC[id]=d.data().image}catch(e){}
if(zid==id){if(hdC[id])i.src=hdC[id];l.textContent=''}}};
window.closeZoom=()=>$('zoom').classList.remove('show');
window.setCat=c=>{cat=c;draw()};
window.setSel=(k,a,v)=>{const g=prods.filter(p=>gk(p)==k);sel[k]={...sel[k],[a]:v};const c=pick(g);sel[k]=Object.fromEntries(A.map(([x])=>[x,val(c,x)]));draw()};
window.addV=id=>{const p=prods.find(x=>x.id===id),q=(cart[id]||0)+1;if(q>p.stock)return alert('No hay más unidades disponibles de esta opción');cart[id]=q;bar();const b=$('bar');b.style.transform='scale(1.04)';setTimeout(()=>b.style.transform='',160)};
const keep=f=>{const I=['fn','fp','ft','fr'],v=I.map(i=>$(i)?$(i).value:'');f();I.forEach((i,n)=>$(i)&&($(i).value=v[n]))};
window.cq=(id,d)=>{const p=prods.find(x=>x.id===id),q=(cart[id]||0)+d;if(q<=0)delete cart[id];else if(q<=p.stock)cart[id]=q;bar();if(!lines().length)return closeCart();keep(form)};
window.openCart=()=>{$('sheet').classList.add('show');form()};
window.closeCart=()=>$('sheet').classList.remove('show');
const PM={'Pago Móvil':'📱 <b>Pago Móvil · Banco Mercantil</b><br>C.I.: 16103509<br>Teléfono: 04126543890',Binance:'💠 <b>Binance</b> (USDT)<br>ID: 1264259398'};
function form(){$('box').innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0;font-size:18px">Tu pedido</h2><button onclick="closeCart()" style="border:0;background:#eee;border-radius:50%;width:34px;height:34px;font-size:16px">✕</button></div>
${lines().map(l=>`<div class="ln"><span>${esc(lab(l.p))}<span class="ql"><button onclick="cq('${l.p.id}',-1)">−</button><b>${l.q}</b><button onclick="cq('${l.p.id}',1)">+</button></span></span><b>${eur(l.p.price*l.q)}</b></div>`).join('')}<div class="ln tot"><span>Total</span><span>${eur(total())}</span></div>
<label>Tu nombre</label><input id="fn" autocomplete="name"><label>Tu teléfono (WhatsApp)</label><input id="fp" type="tel" autocomplete="tel"><label>Notas (opcional)</label><textarea id="ft" rows="2"></textarea>
<label>Método de pago</label><div class="pm">${Object.keys(PM).map(k=>`<button class="${k==pm?'on':''}" onclick="setPm('${k}')">${k}</button>`).join('')}</div><div class="info">${PM[pm]}<br><small>Cobramos $ Divisas, Zelle y USDT (pregunta disponibilidad). Paga y adjunta tu comprobante.</small></div>
<label>Referencia del pago</label><input id="fr"><label>Captura del comprobante</label><input id="ff" type="file" accept="image/*" onchange="pick(this)"><button class="go" id="gb" onclick="send()">Enviar pedido</button>`}
window.setPm=k=>{pm=k;keep(form)};
window.pick=inp=>{const f=inp.files[0];if(!f)return;const im=new Image();im.onload=()=>{const s=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);proof=c.toDataURL('image/jpeg',.7)};im.src=URL.createObjectURL(f)};
window.send=async()=>{const name=$('fn').value.trim(),phone=$('fp').value.trim(),ref=$('fr').value.trim(),items=lines().map(l=>({refId:l.p.id,name:lab(l.p),price:l.p.price,qty:l.q}));
if(!name||phone.replace(/\D/g,'').length<7)return alert('Escribe tu nombre y tu teléfono');if(!items.length)return alert('Tu pedido está vacío');if(!proof&&!ref)return alert('Adjunta la captura del pago o escribe la referencia');
$('gb').disabled=true;try{await setDoc(doc(db,'pedidos','o_'+Date.now()+Math.random().toString(36).slice(2,6)),{status:'nuevo',name,phone,note:$('ft').value.trim(),items,total:total(),method:pm,ref,proof,createdAt:new Date().toISOString()});
for(const k in cart)delete cart[k];proof='';draw();$('box').innerHTML='<div style="text-align:center;padding:24px 8px"><div style="font-size:48px">✅</div><h2>¡Pedido enviado!</h2><p>Revisaremos tu pago y te contactaremos por WhatsApp para confirmar tu compra y enviarte tu factura.</p><button class="go" onclick="closeCart()">Seguir viendo</button></div>'}catch(e){console.error(e);alert('No se pudo enviar el pedido. Intenta de nuevo.');$('gb').disabled=false}};
</script></body></html>
